; No mostrar errores/warnings en la respuesta HTTP (evita fugas de rutas
; internas y corrupción de la salida cuando algo falla a mitad de request).
display_errors = Off
display_startup_errors = Off

; Pero sí registrarlos, para poder diagnosticar sin exponerlos al usuario.
log_errors = On
error_log = /var/www/html/src/storage/logs/php_errors.log
